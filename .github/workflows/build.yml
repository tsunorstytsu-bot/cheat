name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: cl /LD /O2 /EHsc /utf-8 berda_esp.cpp /link user32.lib gdi32.lib /OUT:berda_esp.dll

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dll
          path: berda_esp.dll
